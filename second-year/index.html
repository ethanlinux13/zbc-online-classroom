<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b50"><title>Second Year | Zambales Bible College</title><style>
:root{--navy:#102b50;--blue:#2864a5;--gold:#d5aa4b;--bg:#f3f6fa;--ink:#182538;--muted:#65748a;--line:#dce3ec}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f6f8fb,#eef3f8);font:15px Arial,sans-serif;color:var(--ink)}.wrap{max-width:1000px;margin:auto;padding:22px 16px 40px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.brand img{width:58px;height:58px;object-fit:contain}.brand small{display:block;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:bold;font-size:11px}.brand strong{font-size:19px;color:var(--navy)}.hero{padding:30px;border-radius:20px;background:linear-gradient(125deg,#102b50,#235589);color:white}.hero .eyebrow{color:#d8e4f1;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:bold}.hero h1{font-size:clamp(27px,5vw,42px);margin:9px 0}.hero p{color:#e1eaf3;line-height:1.6;margin:0}.meta{margin-top:16px;color:#f3d995;font-weight:bold}.day{margin-top:24px}.day h2{font-size:16px;color:var(--blue);text-transform:uppercase;letter-spacing:.12em}.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 8px 24px #102b500b}.card h3{margin:9px 0 6px;color:var(--navy);font-size:19px}.card p{margin:5px 0;color:var(--muted);line-height:1.5}.tag{display:inline-block;border-radius:30px;padding:5px 9px;background:#edf2f8;color:#254b75;font-size:11px;font-weight:bold}.time{font-weight:bold;color:var(--navy)!important;margin-top:12px!important}.join{display:block;margin-top:15px;background:var(--blue);color:white;text-decoration:none;text-align:center;padding:12px;border-radius:10px;font-weight:bold}.join.discord{background:#5865f2}.empty,.error{margin-top:20px;background:white;border:1px solid var(--line);border-radius:14px;padding:24px;color:var(--muted);text-align:center}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:650px){.classes{grid-template-columns:1fr}.hero{padding:23px}}
</style></head><body><main class="wrap"><div class="brand"><img src="../zbc-logo.png" alt="ZBC logo"><div><small>Zambales Bible College</small><strong>Online Classroom</strong></div></div><section class="hero"><div class="eyebrow">Certificate in Christian Ministries</div><h1>Second Year</h1><p>Your weekly classes, instructors, class times, and classroom links.</p><div class="meta" id="year">Loading published schedule…</div></section><div id="content"><div class="empty">Loading your classes…</div></div><div class="foot">Zambales Bible College • Equipping Men and Women for Ministry</div></main><script>
const API="https://script.google.com/macros/s/AKfycbwOlXfCyvZQij6HZbV_InWpzK9HAzGDqfuAe1gRzCd4sul8rWANbKfItZOpfib8DpHWfg/exec",LEVEL="second-year";
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(data){document.getElementById('year').textContent=data.academicYear?'Academic Year '+data.academicYear:'Published class schedule';const rows=data.classes||[];if(!rows.length){document.getElementById('content').innerHTML='<div class="empty">No published classes are available yet. Please check again later or contact the registrar.</div>';return}const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let html='';days.forEach(function(day){const items=rows.filter(function(x){return String(x.day).toLowerCase()===day.toLowerCase()});if(!items.length)return;html+='<section class="day"><h2>'+day+'</h2><div class="classes">'+items.map(function(x){const platform=String(x.platform||'Zoom');const link=String(x.link||'');return '<article class="card"><span class="tag">'+esc(platform)+'</span><h3>'+esc(x.subject)+'</h3><p>'+esc(x.instructor)+'</p>'+(x.units?'<p>'+esc(x.units)+' units</p>':'')+'<p class="time">'+esc(x.classTime||'Time to be announced')+' • Philippine Time</p>'+(link?'<a class="join '+(platform.toLowerCase()==='discord'?'discord':'')+'" href="'+esc(link)+'" target="_blank" rel="noopener"> '+(platform.toLowerCase()==='discord'?'Open Discord Classroom':'Join Zoom Class')+' </a>':'<p class="empty">Classroom link will be posted by the registrar.</p>')+'</article>'}).join('')+'</div></section>'});document.getElementById('content').innerHTML=html||'<div class="empty">No classes have been added for this year level.</div>'}
fetch(API+'?student='+encodeURIComponent(LEVEL),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Unable to load schedule');return r.json()}).then(function(d){if(!d.ok)throw new Error('Schedule unavailable');render(d)}).catch(function(e){document.getElementById('content').innerHTML='<div class="error">We could not load the class schedule. Please refresh this page or contact the registrar.</div>';document.getElementById('year').textContent='Schedule unavailable';console.error(e)});
</script></body></html>
