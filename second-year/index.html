<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b50"><title>Second Year | Zambales Bible College</title><style>
:root{--navy:#102b50;--blue:#2864a5;--gold:#d5aa4b;--bg:#f3f6fa;--ink:#182538;--muted:#65748a;--line:#dce3ec}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f6f8fb,#eef3f8);font:15px Arial,sans-serif;color:var(--ink)}.wrap{max-width:1000px;margin:auto;padding:22px 16px 40px}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.brand img{width:58px;height:58px;object-fit:contain}.brand small{display:block;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:bold;font-size:11px}.brand strong{font-size:19px;color:var(--navy)}.hero{padding:30px;border-radius:20px;background:linear-gradient(125deg,#102b50,#235589);color:white}.hero .eyebrow{color:#d8e4f1;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:bold}.hero h1{font-size:clamp(27px,5vw,42px);margin:9px 0}.hero p{color:#e1eaf3;line-height:1.6;margin:0}.meta{margin-top:16px;color:#f3d995;font-weight:bold}.day{margin-top:24px}.day.today{margin-top:22px;padding:20px;border:2px solid var(--gold);border-radius:18px;background:#fffdf7;box-shadow:0 10px 28px #102b5014}.day.today h2{font-size:18px;color:var(--navy);display:flex;align-items:center;gap:10px}.today-label{display:inline-block;background:var(--gold);color:#102b50;border-radius:30px;padding:5px 10px;font-size:10px;letter-spacing:.1em}.today .card{border:1px solid #e6cf98;background:#fff;box-shadow:0 8px 24px #9b77221a}.today .card h3{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:12px 0 9px}.today .card p{font-size:16px}.today .time{font-size:17px!important}.today .join{font-size:16px;padding:15px}.day h2{font-size:16px;color:var(--blue);text-transform:uppercase;letter-spacing:.12em}.classes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 8px 24px #102b500b}.card h3{margin:9px 0 6px;color:var(--navy);font-size:19px}.card p{margin:5px 0;color:var(--muted);line-height:1.5}.tag{display:inline-block;border-radius:30px;padding:5px 9px;background:#edf2f8;color:#254b75;font-size:11px;font-weight:bold}.time{font-weight:bold;color:var(--navy)!important;margin-top:12px!important}.join{display:block;margin-top:15px;background:var(--blue);color:white;text-decoration:none;text-align:center;padding:12px;border-radius:10px;font-weight:bold}.join.discord{background:#5865f2}.empty,.error{margin-top:20px;background:white;border:1px solid var(--line);border-radius:14px;padding:24px;color:var(--muted);text-align:center}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:650px){.classes{grid-template-columns:1fr}.hero{padding:23px}}
</style></head><body><main class="wrap"><div class="brand"><img src="../zbc-logo.png" alt="ZBC logo"><div><small>Zambales Bible College</small><strong>Online Classroom</strong></div></div><section class="hero"><div class="eyebrow">Certificate in Christian Ministries</div><h1>Second Year</h1><p>Your weekly classes, instructors, class times, and classroom links.</p><div class="meta" id="year">Loading published schedule…</div></section><div id="content"><div class="empty">Loading your classes…</div></div><div class="foot">Zambales Bible College • Equipping Men and Women for Ministry</div></main><script>
const LEVEL="Second Year";
const CLASSES=[{"day":"Monday","subject":"Theology 3: Holy Spirit, Church & Last Things","instructor":"Rev. Benedicto Asban","platform":"Zoom","classTime":"6:00 PM","link":"https://zoom.us/j/93561067628?pwd=kLg1qpxvjWZFFhPfIM9jx1vcuCJns8.1"},{"day":"Tuesday","subject":"The Gospel and Epistles of John","instructor":"Rev. Jomar Peter De Guzman","platform":"Discord","classTime":"6:00 PM","link":"https://discord.com/channels/1437746844041089056/1439907580238368790"},{"day":"Wednesday","subject":"Intro to Christian Education","instructor":"Ptr. Nervin Lusung","platform":"Discord","classTime":"6:00 PM","link":"https://discord.com/channels/1437746844041089056/1516686341562302534"},{"day":"Thursday","subject":"Writings & Prophecy (Job–Malachi)","instructor":"Ps. Angelo Atienza","platform":"Zoom","classTime":"6:00 PM","link":"https://us06web.zoom.us/j/81551141792?pwd=eTVDVh4e3cJrga2j0pmdVwpdKqdVdb.1"}];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const today=new Intl.DateTimeFormat('en-US',{weekday:'long',timeZone:'Asia/Manila'}).format(new Date());
  document.getElementById('year').textContent='Today is '+today+' • Philippine Time';
  const ordered=[today].concat(days.filter(function(d){return d!==today}));
  let html='';
  ordered.forEach(function(day){
    const isToday=day===today;
    const items=CLASSES.filter(function(x){return x.day===day});
    if(!items.length && !isToday)return;
    html+='<section class="day '+(isToday?'today':'')+'"><h2>'+day+(isToday?' <span class="today-label">TODAY</span>':'')+'</h2>';
    if(!items.length){html+='<div class="empty">No classes are scheduled for today. Please check the weekly timetable below.</div></section>';return}
    html+='<div class="classes">'+items.map(function(x){
      const platform=String(x.platform||'Zoom');
      return '<article class="card"><span class="tag">'+esc(platform)+'</span><h3>'+esc(x.subject)+'</h3><p>'+esc(x.instructor)+'</p><p class="time">'+esc(x.classTime)+' • Philippine Time</p><a class="join '+(platform.toLowerCase()==='discord'?'discord':'')+'" href="'+esc(x.link)+'" target="_blank" rel="noopener">'+(platform.toLowerCase()==='discord'?'Open Discord Classroom':'Join Zoom Class')+'</a></article>';
    }).join('')+'</div></section>';
  });
  document.getElementById('content').innerHTML=html||'<div class="empty">No classes are listed.</div>';
}
render();
</script></body></html>
